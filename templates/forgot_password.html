{% extends "base.html" %}
{% block title %}Forgot password · Campus Events{% endblock %}
{% block content %}
<div class="auth">
  <div class="auth-card">
    <h1>Reset your password</h1>
    <p class="lede">Enter your registered email and choose a new password.</p>
    <form class="form" method="post">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email }}" required autofocus>
      </div>
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" required minlength="8"
               pattern="{{ password_pattern }}" title="{{ password_hint }}">
        <span class="hint">{{ password_hint }}</span>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
      </div>
      <button class="btn" type="submit">Change password</button>
    </form>
    <p class="auth-foot"><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
  </div>
</div>
{% endblock %}
