{% extends "auth_layout.html" %}
{% block title %}Forgot password{% endblock %}
{% block side_title %}Reset your password{% endblock %}
{% block form %}
  <h1>Forgot your password?</h1>
  <p class="sub">Enter your registered email. We will send a 6-digit code to that address.</p>

  <form class="ax-form" method="post">
    <div class="ax-field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email }}" required autofocus autocomplete="username">
    </div>
    <button class="btn green" type="submit">Send code</button>
  </form>

  <p class="ax-alt"><a href="{{ url_for('auth.login') }}">&larr; Back to log in</a></p>
{% endblock %}
