<!-- templates/admin/user_form.html -->
{% extends "base.html" %}
{% block title %}Add user · Administration{% endblock %}
{% block content %}
<h1>Add an account</h1>
<p class="lede">Use this for organizers and administrators. Share the password with them and ask them to change it after the first login.</p>

<form class="form" method="post">
  <div class="field">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" value="{{ form.name }}" required>
  </div>
  <div class="field">
    <label for="email">College email</label>
    <input type="email" id="email" name="email" value="{{ form.email }}" required>
  </div>
  <div class="row-2">
    <div class="field">
      <label for="role">Role</label>
      <select id="role" name="role">
        <option value="organizer" {% if form.role == 'organizer' %}selected{% endif %}>Organizer</option>
        <option value="admin" {% if form.role == 'admin' %}selected{% endif %}>Administrator</option>
        <option value="student" {% if form.role == 'student' %}selected{% endif %}>Student</option>
      </select>
    </div>
    <div class="field">
      <label for="department">Department</label>
      <input type="text" id="department" name="department" value="{{ form.department }}">
    </div>
  </div>
  <div class="row-2">
    <div class="field">
      <label for="phone">Phone</label>
      <input type="text" id="phone" name="phone" value="{{ form.phone }}">
    </div>
    <div class="field">
      <label for="password">Temporary password</label>
      <input type="password" id="password" name="password" required>
    </div>
  </div>
  <div style="display:flex;gap:10px">
    <button class="btn" type="submit">Create account</button>
    <a class="btn btn-quiet" href="{{ url_for('admin.users') }}">Cancel</a>
  </div>
</form>
{% endblock %}
