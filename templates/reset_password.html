{% extends "auth_layout.html" %}
{% block title %}Choose a new password{% endblock %}
{% block side_title %}Reset your password{% endblock %}
{% block form %}
  <h1>Choose a new password</h1>
  <p class="sub">Enter a new password for your account.</p>

  <form class="ax-form" method="post">
    <div class="ax-field">
      <label for="password">New password</label>
      <input type="password" id="password" name="password" required minlength="8" autofocus
             pattern="{{ password_pattern }}" title="{{ password_hint }}" autocomplete="new-password">
      <span class="hint">{{ password_hint }}</span>
    </div>
    <div class="ax-field">
      <label for="confirm_password">Confirm new password</label>
      <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
    </div>
    <button class="btn green" type="submit">Change password</button>
  </form>

  <p class="ax-alt"><a href="{{ url_for('auth.login') }}">&larr; Back to log in</a></p>
{% endblock %}
