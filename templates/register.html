{% extends "base.html" %}
{% block title %}Create account · Campus Events{% endblock %}
{% block content %}
<div class="auth">
  <div class="auth-card">
  <h1>Create your student account</h1>
  <p class="lede">Organizer accounts are created by the administrator.</p>
  <form class="form" method="post">
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" value="{{ form.name }}" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ form.email }}" required>
    </div>
    <div class="row-2">
    <!--<div class="field">
        <label for="usn">USN</label>
        <input type="text" id="usn" name="usn" value="{{ form.usn }}" required>
      </div>-->
      <div class="field">
        <label for="department">Department</label>
        <input type="text" id="department" name="department" value="{{ form.department }}">
      </div>
    </div>
    <div class="field">
      <label for="phone">Phone (optional)</label>
      <input type="text" id="phone" name="phone" value="{{ form.phone }}">
    </div>
    <div class="row-2">
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <span class="hint">At least 6 characters.</span>
      </div>
      <div class="field">
        <label for="confirm_password">Repeat password</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
      </div>
    </div>
    <button class="btn" type="submit">Create account</button>
  </form>
  <p class="auth-foot">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
