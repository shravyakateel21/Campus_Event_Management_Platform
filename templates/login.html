{% extends "base.html" %}
{% block title %}Log in · Campus Events{% endblock %}
{% block content %}
<div class="auth">
  <div class="auth-card">
    <h1>Log in</h1>
    <p class="lede">Students, organizers and administrators use the same login.</p>
    <form class="form" method="post">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email }}" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button class="btn" type="submit">Log in</button>
    </form>
    <p class="auth-foot">New student? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
